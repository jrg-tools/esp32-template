; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; XIAO ESP32-S3's native USB CDC wires DTR/RTS into the auto-reset circuit
; (same as classic UART bridges). `pio device monitor` asserts both by
; default, which can hold the chip in reset/bootloader — total serial
; silence, not just a missed first line. Telling it not to touch either
; line lets the board boot normally with the monitor attached.
monitor_rts = 0
monitor_dtr = 0
build_flags = -std=gnu++2a
build_unflags = -std=gnu++11
; Web UI (SvelteKit build) lives on a LittleFS partition.
; Build it with `pnpm deploy` in web/, flash with `pio run -t uploadfs`.
board_build.filesystem = littlefs
; Octal PSRAM + Quad flash — the XIAO ESP32-S3's memory layout. Reported at
; boot (see setup()'s "psram" figure).
board_build.arduino.memory_type = qio_opi
lib_deps =
	bblanchon/ArduinoJson@^7.0.0
